name: BoringCache Cargo validation
on:
  push:
    branches: [boringcache-validation]
    paths: [.github/workflows/boringcache-validation.yml]
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact CLI release override
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: moagan-cargo-validation
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: env -u CARGO_TARGET_DIR -u RUSTC_WRAPPER -u CC -u CXX
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
jobs:
  checks:
    name: Formatting and dependency guards
    if: github.repository == 'boringcache/moagan' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: f5c7605ba1d15a7b879e8f428e7e8726022fdbf3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: make fmt-check guard-deps
  cold:
    name: ${{ matrix.provider }} ${{ matrix.check }} cold
    
    if: github.repository == 'boringcache/moagan' && github.ref == 'refs/heads/boringcache-validation'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        provider: [GitHub, BoringCache]
        check: [clippy, test-tests, test-lib, smoke, e2e, test-doc]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_PROVIDER: ${{ matrix.provider }}
      VALIDATION_POLICY: write
      VALIDATION_CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-setup
        with:
          source_ref: f5c7605ba1d15a7b879e8f428e7e8726022fdbf3
          cache_seed: ${{ github.run_id }}
          check: ${{ matrix.check }}
      - name: Restore the corrected upstream Cargo cache
        if: matrix.provider == 'GitHub'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: source -> target
          shared-key: ${{ github.run_id }}-${{ matrix.check }}
          cache-workspace-crates: true
          lookup-only: false
          save-if: 'true'
      - name: Install the native compiler-cache prerequisite
        if: matrix.provider == 'BoringCache'
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
        with:
          tool: sccache@0.17.0
      - name: Configure BoringCache dependency caching
        if: matrix.provider == 'BoringCache'
        id: cache
        uses: boringcache/one@90111526eb218a7f1e119ac2b29f765bd4d82734 # v1.21.0
        with:
          mode: archive
          cache-profiles: dependencies
          working-directory: source
          cli-version: ${{ inputs.cli_version }}
          trust-policy: publish
          fail-on-cache-error: true
      - name: Run the upstream check
        working-directory: source
        run: /usr/bin/time -v -o "$RUNNER_TEMP/validation/build-time.txt" bash .github/boringcache-build.sh
      - name: Retain workload and product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider }}-${{ matrix.check }}-cold
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.cache.outputs.evidence-path }}
          retention-days: 14
  warm:
    name: ${{ matrix.provider }} ${{ matrix.check }} warm
    needs: cold
    if: github.repository == 'boringcache/moagan' && github.ref == 'refs/heads/boringcache-validation'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        provider: [GitHub, BoringCache]
        check: [clippy, test-tests, test-lib, smoke, e2e, test-doc]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_PROVIDER: ${{ matrix.provider }}
      VALIDATION_POLICY: read-only
      VALIDATION_CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-setup
        with:
          source_ref: f5c7605ba1d15a7b879e8f428e7e8726022fdbf3
          cache_seed: ${{ github.run_id }}
          check: ${{ matrix.check }}
      - name: Restore the corrected upstream Cargo cache
        if: matrix.provider == 'GitHub'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: source -> target
          shared-key: ${{ github.run_id }}-${{ matrix.check }}
          cache-workspace-crates: true
          lookup-only: false
          save-if: 'false'
      - name: Install the native compiler-cache prerequisite
        if: matrix.provider == 'BoringCache'
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
        with:
          tool: sccache@0.17.0
      - name: Configure BoringCache dependency caching
        if: matrix.provider == 'BoringCache'
        id: cache
        uses: boringcache/one@90111526eb218a7f1e119ac2b29f765bd4d82734 # v1.21.0
        with:
          mode: archive
          cache-profiles: dependencies
          working-directory: source
          cli-version: ${{ inputs.cli_version }}
          trust-policy: restore
          fail-on-cache-error: true
      - name: Run the upstream check
        working-directory: source
        run: /usr/bin/time -v -o "$RUNNER_TEMP/validation/build-time.txt" bash .github/boringcache-build.sh
      - name: Retain workload and product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider }}-${{ matrix.check }}-warm
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.cache.outputs.evidence-path }}
          retention-days: 14
